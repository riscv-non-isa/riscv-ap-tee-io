---
name: Create Specification Document

# The workflow is triggered by pull request, push to main, and manual dispatch.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. X.Y.Z:'
        required: true
        type: string
      revision_mark:
        description: 'Set revision mark as Draft, Release or Stable:'
        required: true
        type: choice
        options:
          - Draft
          - Release
          - Stable
        default: Draft
      prerelease:
        description: Tag as a pre-release?
        required: false
        type: boolean
        default: true
      draft:
        description: Create release as a draft?
        required: false
        type: boolean
        default: false
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    # Self-hosted Kroki so the build no longer depends on the public
    # kroki.io (rate limits / intermittent 5xx were dropping diagrams).
    services:
      mermaid:
        image: yuzutech/kroki-mermaid
        ports:
          - 8002
      kroki:
        image: yuzutech/kroki
        env:
          KROKI_MERMAID_HOST: mermaid
        ports:
          - 8000:8000

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # Pull the latest RISC-V Docs container image
      - name: Pull Container
        run: docker pull riscvintl/riscv-docs-base-container-image:latest

      # Override VERSION and REVMARK for manual workflow dispatch
      - name: Update environment variables
        run: |
          echo "VERSION=v${{ github.event.inputs.version }}" >> "$GITHUB_ENV"
          echo "REVMARK=${{ github.event.inputs.revision_mark }}" >> "$GITHUB_ENV"
        if: github.event_name == 'workflow_dispatch'

      # Build Files
      - name: Build Files
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 3
          # --network=host lets the make-launched build container reach the
          # Kroki service published on the runner at localhost:8000.
          command: make DOCKER_NET=--network=host KROKI_SERVER_URL=http://localhost:8000


      # Upload the built PDF files as a single artifact
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Build Artifacts
          path: ${{ github.workspace }}/build/*.pdf
          retention-days: 30

      # Create Release
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ github.workspace }}/build/*.pdf
          tag_name: v${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          draft: ${{ github.event.inputs.draft }}
          prerelease: ${{ github.event.inputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GHTOKEN }}
        if: github.event_name == 'workflow_dispatch'
        # This condition ensures this step only runs for workflow_dispatch events.
